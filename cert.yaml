AWSTemplateFormatVersion: "2010-09-09"
Description: >
  pocketshell.io viewer certificate for CloudFront (must live in us-east-1)
  plus its DNS validation records in the Route53 zone owned by the
  sandbox/pocketshell-web stack. Deployed by that stack's deploy.sh; DNS
  validation completes as soon as the GoDaddy delegation to the zone is live.

Parameters:
  ZoneId:
    Type: String
    Description: Route53 zone ID of pocketshell.io (pocketshell-web stack output).

Resources:
  Cert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: pocketshell.io
      SubjectAlternativeNames: [www.pocketshell.io]
      ValidationMethod: DNS
      Tags:
        - {Key: Project, Value: pocketshell-web}
        - {Key: Environment, Value: sandbox}
        - {Key: ManagedBy, Value: cloudformation}

  # CloudFormation cannot read a certificate's DNS validation options, so a
  # custom resource mirrors them into the zone as CNAMEs (upsert on
  # create/update, removed on delete).
  ValidationHelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: helper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Ref Cert
              - Effect: Allow
                Action: [route53:ChangeResourceRecordSets, route53:ListResourceRecordSets]
                Resource: !Sub "arn:aws:route53:::hostedzone/${ZoneId}"

  ValidationRecords:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ValidationHelper.Arn
      CertificateArn: !Ref Cert
      ZoneId: !Ref ZoneId

  ValidationHelper:
    Type: AWS::Lambda::Function
    Properties:
      Description: Mirror ACM DNS validation records into Route53 for pocketshell.io
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      Code:
        ZipFile: |
          const { ACMClient, DescribeCertificateCommand } = require('@aws-sdk/client-acm');
          const { Route53Client, ChangeResourceRecordSetsCommand } = require('@aws-sdk/client-route53');
          const https = require('https');
          const { URL } = require('url');
          const acm = new ACMClient();
          const r53 = new Route53Client();

          // CloudFormation cannot read a certificate's DNS validation
          // options, so this custom resource mirrors them into the zone as
          // CNAMEs. Deletion is a no-op: the zone (and with it the records)
          // belongs to the main stack.
          exports.handler = async (event, context) => {
            let status = 'SUCCESS', reason = '', physicalId =
              event.PhysicalResourceId || `acm-validation-${event.RequestId}`;
            try {
              if (event.RequestType !== 'Delete') {
                const { CertificateArn, ZoneId } = event.ResourceProperties;
                const cert = await acm.send(new DescribeCertificateCommand({ CertificateArn }));
                const options = (cert.Certificate.DomainValidationOptions || [])
                  .filter((o) => o.ResourceRecord && o.ResourceRecord.Name && o.ResourceRecord.Value);
                if (options.length === 0) throw new Error('certificate has no DNS validation options yet');
                await r53.send(new ChangeResourceRecordSetsCommand({
                  HostedZoneId: ZoneId,
                  ChangeBatch: {
                    Changes: options.map((o) => ({
                      Action: 'UPSERT',
                      ResourceRecordSet: {
                        Name: o.ResourceRecord.Name,
                        Type: 'CNAME',
                        TTL: 300,
                        ResourceRecords: [{ Value: o.ResourceRecord.Value }],
                      },
                    })),
                  },
                }));
                physicalId = `acm-validation-${CertificateArn.split('/').pop()}`;
              }
            } catch (err) {
              console.error(err);
              status = 'FAILED';
              reason = err.message;
            }
            const body = JSON.stringify({
              Status: status,
              Reason: reason || `See CloudWatch ${context.logGroupName}`,
              PhysicalResourceId: physicalId,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              Data: {},
            });
            await new Promise((resolve) => {
              const req = https.request(new URL(event.ResponseURL), {
                method: 'PUT',
                headers: { 'content-length': Buffer.byteLength(body) },
              }, (res) => { res.resume(); resolve(); });
              req.on('error', (e) => { console.error('cfn response failed', e); resolve(); });
              req.end(body);
            });
          };

Outputs:
  CertArn:
    Value: !Ref Cert
