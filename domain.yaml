AWSTemplateFormatVersion: "2010-09-09"
Description: >
  pocketshell.io custom domain for the pocketshell-web site: a CloudFront
  distribution carrying the apex/www aliases and the us-east-1 viewer
  certificate, plus Route53 alias records in the delegated zone. Deployed by
  deploy.sh (ENABLE_CUSTOM_DOMAIN=true) only after GoDaddy delegates
  pocketshell.io to the sandbox zone and the certificate has issued — kept
  out of the main stack because CloudFormation early validation
  existence-checks certificate ARNs even behind false conditions.

Parameters:
  ZoneId:
    Type: String
  CertificateArn:
    Type: String
    Description: Issued us-east-1 ACM certificate for pocketshell.io (+ www).
  OriginDistributionDomain:
    Type: String
    Description: Domain name of the main stack's site distribution (origin).
  OriginDistributionId:
    Type: String
    Description: ID of the main stack's site distribution (comment/trace only).

Resources:
  DomainOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pocketshell-web-domain-oac
        Description: Custom-domain distribution access to the pocketshell-web site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: pocketshell-web-www-redirect-domain
      AutoPublish: true
      FunctionConfig:
        Comment: 308 www.pocketshell.io to the apex (custom domain distribution)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.pocketshell.io') {
            return {
              statusCode: 308,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {value: 'https://pocketshell.io' + request.uri},
              },
            };
          }
          return request;
        }

  DomainDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: pocketshell.io web client (aliases + custom cert; origin is the main site distribution)
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        Aliases: [pocketshell.io, www.pocketshell.io]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !Ref OriginDistributionDomain
            OriginAccessControlId: !Ref DomainOac
            S3OriginConfig: {OriginReadTimeout: 30}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !Ref WwwRedirectFunction
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
        Restrictions:
          GeoRestriction: {RestrictionType: none}

  AliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref ZoneId
      RecordSets:
        - Name: pocketshell.io.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront edge, fixed value
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: pocketshell.io.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.pocketshell.io.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.pocketshell.io.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false

Outputs:
  DomainDistributionId:
    Value: !Ref DomainDistribution
