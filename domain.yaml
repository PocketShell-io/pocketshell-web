AWSTemplateFormatVersion: "2010-09-09"
Description: >
  pocketshell.io custom domain for the pocketshell-web site: a CloudFront
  distribution carrying the apex/www aliases and the us-east-1 viewer
  certificate, plus Route53 alias records in the delegated zone. Deployed by
  deploy.sh after the certificate has issued — kept out of the main stack
  because CloudFormation early validation existence-checks certificate ARNs
  even behind false conditions, and because the wait for issuance must not
  block the plain site deploy.

Parameters:
  ZoneId:
    Type: String
  CertificateArn:
    Type: String
    Description: Issued us-east-1 ACM certificate for pocketshell.io (+ www).
  OriginDistributionDomain:
    Type: String
    Description: Domain name of the main stack's site distribution (origin).
  OriginDistributionId:
    Type: String
    Description: ID of the main stack's site distribution (comment/trace only).

Resources:
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: pocketshell-web-www-redirect-domain
      AutoPublish: true
      FunctionConfig:
        Comment: 308 www.pocketshell.io to the apex (custom domain distribution)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.pocketshell.io') {
            return {
              statusCode: 308,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {value: 'https://pocketshell.io' + request.uri},
              },
            };
          }
          return request;
        }

  DomainDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: pocketshell.io web client (aliases + custom cert; origin is the main site distribution)
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        Aliases: [pocketshell.io, www.pocketshell.io]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # Chained distributions: the origin is the main stack's site
          # distribution (*.cloudfront.net), so this MUST be a custom-origin
          # config — S3OriginConfig+OAC is validated against a real bucket
          # name and fails with "does not refer to a valid S3 bucket". HTTP
          # to a cloudfront.net origin is the only supported protocol; the
          # viewer-facing side stays HTTPS, and the inner distribution owns
          # the bucket access (OAC) and the SPA fallback errors.
          - Id: site
            DomainName: !Ref OriginDistributionDomain
            CustomOriginConfig:
              # https-only, not http-only: the inner distribution redirects
              # plain-HTTP viewers to HTTPS (its own redirect-to-https
              # policy), and that 301 is what the chain would hand back.
              # The *.cloudfront.net certificate covers the origin fetch.
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          # Forward every viewer header except Host: CloudFront custom origins
          # otherwise pass the viewer's Host (pocketshell.io) to the inner
          # distribution, which rejects the unknown alias and 301s to its own
          # *.cloudfront.net domain. With this policy the origin sees its own
          # hostname and serves the alias request normally.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !Ref WwwRedirectFunction
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
        Restrictions:
          GeoRestriction: {RestrictionType: none}

  AliasRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref ZoneId
      RecordSets:
        - Name: pocketshell.io.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront edge, fixed value
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: pocketshell.io.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.pocketshell.io.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.pocketshell.io.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt DomainDistribution.DomainName
            EvaluateTargetHealth: false

Outputs:
  DomainDistributionId:
    Value: !Ref DomainDistribution
