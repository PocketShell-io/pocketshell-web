# Reports drift between @pocketshell/core main and the core commit this
# site is pinned to (the `ref:` of the core checkout in test.yml and
# deploy.yml). It never deploys: a core push must not reach users without a
# reviewed pin bump in this repo (key-vault review item 6). Every 15
# minutes: compare the live /core-sha.txt and the pin with core main, and
# leave a warning on the run when they differ.
name: sync core

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-core
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare the live and pinned core with core main
        run: |
          set -euo pipefail
          live="$(curl -fsSL --max-time 20 "https://app.pocketshell.io/core-sha.txt?nocache=$RANDOM" | tr -d '[:space:]' || echo unknown)"
          pin="$(sed -n 's/^ *ref: \([0-9a-f]\{40\}\) *$/\1/p' .github/workflows/deploy.yml | head -1)"
          head="$(git ls-remote https://github.com/PocketShell-io/pocketshell-core refs/heads/main | cut -f1)"
          echo "live: $live"
          echo "pinned: $pin"
          echo "core main: $head"
          if [ "$live" != "$pin" ]; then
            echo "::warning::the live site ($live) is not built from the pinned core ($pin); merge or redeploy main"
          fi
          if [ "$head" != "$pin" ]; then
            echo "::warning::core main ($head) moved past the pinned core ($pin); review it and bump the ref in test.yml + deploy.yml by PR"
          fi
